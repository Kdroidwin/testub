name: Update X badware domains

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: update-x-badware-domains
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read recent posts and write the filter list
        env:
          TWITTER_RELAY_BASE_URL: ${{ secrets.TWITTER_RELAY_BASE_URL }}
          TWITTER_RELAY_BEARER_TOKEN: ${{ secrets.TWITTER_RELAY_BEARER_TOKEN }}
          TWITTER_RELAY_PROFILE: ${{ secrets.TWITTER_RELAY_PROFILE }}
          TWITTER_USERNAME: masaomi346
          TWEETS_PER_PAGE: "40"
          MAX_TWEET_PAGES: "10"
          DOMAINS_OUTPUT: ublockoriginbadwarefromx.txt
        run: python .github/scripts/update_domains.py
      - name: Commit updated filter list
        run: |
          if [ -z "$(git status --porcelain -- ublockoriginbadwarefromx.txt)" ]; then
            echo "ublockoriginbadwarefromx.txt is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ublockoriginbadwarefromx.txt
          git commit -m "Update X badware domain list"
          git push
